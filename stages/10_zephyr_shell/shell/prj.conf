# Standard Shell owns UART input in this separate application.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART="zephyr> "

# Application controls led0 through the GPIO API.
CONFIG_GPIO=y
CONFIG_LED_GPIO=n

# Do not start Console character/line input alongside Shell.
CONFIG_CONSOLE_SUBSYS=n
CONFIG_CONSOLE_HANDLER=n
CONFIG_LOG=n
