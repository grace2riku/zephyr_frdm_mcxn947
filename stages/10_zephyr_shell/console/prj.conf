# UART console and character input/output API.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE_SUBSYS=y
CONFIG_CONSOLE_GETCHAR=y

# One receiver: Console owns UART input in this application.
CONFIG_SHELL=n
CONFIG_CONSOLE_GETLINE=n
CONFIG_CONSOLE_HANDLER=n

# Only startup/error messages use printk; no logging backend.
CONFIG_PRINTK=y
CONFIG_LOG=n
